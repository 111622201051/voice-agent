agent:
  name: "Shree"
  llm_model: "qwen2.5:3b"

tts:
  engine: "edge_tts"
  # When true, reply using the user's cloned voice (F5-TTS local, then Fish Audio).
  # Falls back to Edge neural voices automatically if cloning is unavailable.
  enable_voice_clone: true
  # Re-capture the user's verified speech during conversation and use it as the
  # live clone reference, so replies keep matching your tone, pitch and style.
  clone_from_verified_speech: true
  tamil_voice: "ta-IN-PallaviNeural"
  english_voice: "en-IN-NeerjaExpressiveNeural"
  tanglish_voice: "en-IN-NeerjaExpressiveNeural"
  fish_base_url: "https://api.fish.audio"
  clone_audio_path: "data/voice_profiles/clone_reference.wav"
  clone_meta_path: "data/voice_profiles/clone_reference.json"

stt:
  model_size: "small"
  device: "cpu"

vad:
  threshold: 0.40

verification:
  threshold: 0.60
  interrupt_threshold: 0.58